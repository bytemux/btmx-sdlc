# Local gates for docs/conventions.md. No external hook repos.
# Install in each clone:
#   pre-commit install
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      # first line of the commit message = Conventional Commits
      - id: conventional-commit-msg
        name: conventional commit message
        language: pygrep
        entry: '\A(feat|fix|refactor|perf|test|docs|style|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: \S'
        args: [--multiline, --negate]   # fail if the message does not start with the pattern
        stages: [commit-msg]

      # commits only on main or <type>/<n>-<slug>; detached HEAD (rebase) is allowed
      - id: branch-name
        name: branch name
        language: system
        entry: sh
        args:
          - -c
          - 'b=$(git symbolic-ref --short -q HEAD) || exit 0; echo "$b" | grep -Eqx "main|(feat|fix|refactor|perf|test|docs|style|build|ci|chore|revert)/[0-9]+-[a-z0-9-]+" || { echo "branch must be main or <type>/<n>-<slug>, got: $b"; exit 1; }'
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
